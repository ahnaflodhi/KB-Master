name: kb-orchestrator-core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify frontmatter, cross-refs, bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make tools executable
        run: chmod +x tools/*.sh

      - name: Verify frontmatter (strict — required keys + max_lines)
        run: tools/verify-frontmatter.sh --strict

      - name: Verify cross-references between Layer-2 files
        run: tools/verify-cross-refs.sh

      - name: Verify bundle manifests (referential integrity)
        run: tools/build-bundle.sh --check

      - name: Verify no runtime load surface references the monolith
        run: tools/verify-no-monolith.sh

  monolith-reproducible:
    name: SYSTEM-BLUEPRINT.md is exactly the generator output
    runs-on: ubuntu-latest
    # Standing gate (v3.0). Replaces the former `monolith-edit-guard`, which only
    # required "some Layer-2 co-change" and so could wave a hand-edited semantic
    # delta through. Per JCC design review (ledger job jcc-gate-design-001), the
    # real post-demotion invariant is EXACT REPRODUCIBILITY: the committed monolith,
    # with volatile timestamp lines normalized out, must byte-equal a fresh
    # generation from Layer-2. Any direct edit to SYSTEM-BLUEPRINT.md fails this.
    # See adoption-guides/static-regeneration-gate.md.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make tools executable
        run: chmod +x tools/*.sh

      - name: Verify blueprint coverage + exact reproducibility
        run: tools/verify-blueprint.sh
