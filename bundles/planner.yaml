bundle: planner
version: 1
# Per bundles/_README.md target: ~2,800 tokens. Compact bundle — Planner reads spec/contract sources only.
loads:
  - 00-overview/invariants.md
  - 00-overview/glossary.md
  - 10-pipeline/state-machine.md
  - 10-pipeline/iteration-lifecycle.md
  - 10-pipeline/file-contracts.md
  - 20-roles/planner.md
  - 60-schemas/spec.md
  - 60-schemas/contract.md
optional:
  - 60-schemas/audit-report.md       # only when re-plan after REVISE
  - 60-schemas/eval-report.md        # only when re-plan after SPEC-FLAW
  - 80-status/shipped-vs-planned.md
adapter_specific:
  claude-native:
    - 50-adapters/claude-native.md
  codex-bridge:
    - 50-adapters/codex-bridge.md
estimated_tokens: ~2800
loadable_by_protocol: 1
